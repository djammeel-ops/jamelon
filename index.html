<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حل الجمالون</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f7f7f5;--card:#fff;--fg:#1d1d1b;--mut:#6b6b66;--bd:#d9d9d3;--ac:#1f6feb;--ten:#1f6feb;--com:#d93025;--ld:#e07b00;--gr:#e6e6e0;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--card:#222;--fg:#eee;--mut:#9a9a94;--bd:#3a3a38;--ac:#4c8dff;--ten:#5a9bff;--com:#ff6b60;--ld:#ffa040;--gr:#333;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161616;--card:#222;--fg:#eee;--mut:#9a9a94;--bd:#3a3a38;--ac:#4c8dff;--ten:#5a9bff;--com:#ff6b60;--ld:#ffa040;--gr:#333;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
main{max-width:720px;margin:0 auto;padding:8px}
#cv{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--bd);border-radius:10px;touch-action:none;user-select:none}
.g{stroke:var(--gr);stroke-width:1}
#sm{display:none;gap:6px;margin-top:8px;justify-content:center}
#sm button{padding:5px 12px;border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--fg);font:12px inherit;display:flex;align-items:center;gap:4px}
#sm svg{width:16px;height:16px}
#sm button.on{border-color:var(--ac);color:var(--ac)}
#tb{display:flex;gap:4px;margin-top:8px;justify-content:center}
#tb button{flex:1 1 0;max-width:52px;min-width:0;padding:4px 0;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font:9.5px inherit;display:flex;flex-direction:column;align-items:center;gap:1px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tb button.on{border-color:var(--ac);background:var(--ac);color:#fff}
#tb button.calc{background:#1a9b4b;border-color:#1a9b4b;color:#fff}
#hint{font-size:12.5px;color:var(--mut);margin:8px 2px;min-height:16px}
.row{display:none;flex-wrap:wrap;gap:8px;align-items:flex-end;font-size:12px;margin-bottom:8px}
.row label{display:flex;flex-direction:column;gap:2px;color:var(--mut)}
.row input{width:76px;padding:5px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--fg);direction:ltr;font-size:14px}
.row button{padding:7px 14px;border:0;border-radius:6px;background:var(--ac);color:#fff;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:12px}
.card h2{font-size:15px;margin:0 0 6px}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:center}
.t{color:var(--ten);font-weight:700}.c{color:var(--com);font-weight:700}
.err{color:var(--com);font-weight:600}
.scroll{overflow-x:auto}
#sm{grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.12)}
#sm button{padding:8px 2px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--fg);font:11px inherit;flex-direction:column;align-items:center;gap:4px}
#sm svg{width:28px;height:28px}
#sm button.on{border-color:var(--ac);color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--card))}
#tb{gap:4px;margin-top:10px;padding:6px;background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
#tb button{max-width:none;padding:7px 0 6px;border:0;border-radius:13px;background:transparent;color:var(--mut);font:10.5px inherit;gap:3px}
svg.i{width:25px;height:25px;stroke-width:1.8}
.f{fill:currentColor;fill-opacity:.2}.s{fill:currentColor;stroke:none}
#tb button.on{background:var(--ac);color:#fff}
#tb button.calc{background:#1a9b4b;color:#fff}
#tb button.cl{color:var(--com)}
#tb button:disabled{opacity:.35}
#sm.sup{grid-template-columns:repeat(2,1fr)}
.row select{padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--fg);font-size:14px;min-width:76px}
.cw{position:relative}
#zm{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:6px}
#zm button{width:38px;height:38px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);font-size:20px;line-height:1;opacity:.93;padding:0}
</style>
</head>
<body>
<main>
<div class="cw"><svg id="cv" viewBox="0 0 1200 800"></svg><div id="zm"><button data-z="in">+</button><button data-z="out">−</button><button data-z="fit">⤢</button></div></div>
<div id="sm"></div>
<div id="tb"></div>
<div id="hint"></div>
<div class="row" id="pn"><label>الفاصلة x (m)<input id="nx" type="number" step="any" enterkeyhint="next" value="0"></label><label>الترتيبة y (m)<input id="ny" type="number" step="any" enterkeyhint="done" value="0"></label><button id="go">إضافة</button></div>
<div class="row" id="pl"><label>العقدة<select id="ln"></select></label><label>Fx (kN)<input id="fx" type="number" step="any" enterkeyhint="next" value="0"></label><label>Fy (kN)<input id="fy" type="number" step="any" enterkeyhint="done" value="-10"></label><button id="ap">تطبيق</button></div>
<div class="row" id="pa"><label>المساحة A (cm²)<input id="A" type="number" step="any" inputmode="decimal" enterkeyhint="next" placeholder="اختياري"></label><label>الإجهاد σ (MPa)<input id="sg" type="number" step="any" inputmode="decimal" enterkeyhint="done" placeholder="اختياري"></label><small style="flex-basis:100%;color:var(--mut)">أدخل أحدهما فقط، وبعد «حساب» يظهر الآخر.</small></div>
<div id="out"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const I={
select:'<path d="M5 3l12 8-5 1.5L9.5 18z"/>',
node:'<circle cx="12" cy="12" r="5" fill="currentColor"/>',
bar:'<circle cx="5" cy="19" r="2.5" fill="currentColor"/><circle cx="19" cy="5" r="2.5" fill="currentColor"/><path d="M6.5 17.5l11-11"/>',
load:'<path d="M12 3v15M6 12l6 7 6-7"/>',
pin:'<path d="M12 6l7 12H5z"/><path d="M3 21h18"/>',
rollerY:'<path d="M12 4l6 10H6z"/><circle cx="9" cy="18" r="2"/><circle cx="15" cy="18" r="2"/><path d="M3 22h18"/>',
rollerX:'<g transform="rotate(90 12 12)"><path d="M12 4l6 10H6z"/><circle cx="9" cy="18" r="2"/><circle cx="15" cy="18" r="2"/><path d="M3 22h18"/></g>',
del:'<path d="M5 5l14 14M19 5L5 19"/>',
calc:'<path d="M7 4l13 8-13 8z" fill="currentColor"/>',
clr:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
add:'<path d="M12 4v16M4 12h16"/>'};
Object.assign(I,{
select:'<path class="f" d="M5 3l13 8-5.5 1.8L9.5 19z"/>',
add:'<circle class="f" cx="12" cy="12" r="9"/><path d="M12 7.5v9M7.5 12h9"/>',
node:'<circle cx="12" cy="12" r="9" opacity=".35"/><circle class="s" cx="12" cy="12" r="5"/>',
bar:'<path d="M6 18L18 6"/><circle class="s" cx="6" cy="18" r="3"/><circle class="s" cx="18" cy="6" r="3"/>',
load:'<path d="M12 3v13"/><path class="f" d="M6.5 12.5L12 20l5.5-7.5z"/>',
pin:'<path class="f" d="M12 5l7 13H5z"/><path d="M3 21h18"/><circle class="s" cx="12" cy="5" r="2"/>',
rollerY:'<path class="f" d="M12 4l6.5 10h-13z"/><circle cx="8.5" cy="17.5" r="2"/><circle cx="15.5" cy="17.5" r="2"/><path d="M3 21.5h18"/>',
rollerX:'<g transform="rotate(90 12 12)"><path class="f" d="M12 4l6.5 10h-13z"/><circle cx="8.5" cy="17.5" r="2"/><circle cx="15.5" cy="17.5" r="2"/><path d="M3 21.5h18"/></g>',
del:'<circle class="f" cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>',
calc:'<path class="s" d="M8 5l11 7-11 7z" stroke-linejoin="round"/>',
clr:'<path class="f" d="M6 7l1 13h10l1-13z"/><path d="M4 7h16M9.5 7V4h5v3"/>',
undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/>',
sup:'<path class="f" d="M12 8l6 11H6z"/><path d="M3 21h18M12 3v5"/>',
pinV:'<g transform="rotate(90 12 12)"><path class="f" d="M12 5l7 13H5z"/><path d="M3 21h18"/><circle class="s" cx="12" cy="5" r="2"/></g>'});
const svg=k=>`<svg class="i" viewBox="0 0 24 24">${I[k]}</svg>`;
const HINT={select:'انقر على عقدة لتحديدها: اسحبها أو عدّل إحداثياتها يدويًا.',node:'انقر على الرسم لإضافة عقدة، أو اكتب الفاصلة والترتيبة ثم «إضافة».',bar:'انقر على عقدة ثم على عقدة أخرى لرسم قضيب.',load:'اكتب Fx وFy ثم انقر على العقدة لتطبيق الحمل.',
pin:'انقر على عقدة: مسند مفصلي أفقي (يمنع الحركتين).',pinV:'انقر على عقدة: مسند مفصلي شاقولي (يمنع الحركتين).',rollerY:'انقر على عقدة: مسند متحرك أفقي (يمنع الحركة الرأسية فقط).',rollerX:'انقر على عقدة: مسند متحرك شاقولي (يمنع الحركة الأفقية فقط).',del:'انقر على قضيب لحذفه. النقر المتكرر على عقدة يحذف المسند ثم الأحمال (آخر حمل أولًا) ثم العقدة.'};
const SUB=[['node','عقدة'],['bar','قضيب'],['load','حمل'],['sup','مسند']];
const SUP=[['pin','مفصلي أفقي'],['rollerY','متحرك أفقي'],['pinV','مفصلي شاقولي'],['rollerX','متحرك شاقولي']];
const MAIN=[['select','تحريك'],['pin','مفصلي'],['rollerY','متحرك أ'],['rollerX','متحرك ر'],['del','حذف']];
const nm=i=>(i>=26?nm(Math.floor(i/26)-1):'')+String.fromCharCode(65+i%26);
let tool='bar',sub='bar',menu=false,pend=null,sel=null,drag=null,moved=false,res=null,V={x0:0,y0:0,w:12,h:8};
let nodes=[{x:2,y:2},{x:8,y:2},{x:5,y:5}],bars=[[0,1],[0,2],[1,2]],sup={0:'pin',1:'rollerY'},loads={2:[[0,-10]]};
const isC=t=>SUB.some(s=>s[0]==t)||SUP.some(s=>s[0]==t);
function buildTb(){
  let h=`<button data-t="select" class="${tool=='select'?'on':''}">${svg('select')}تحريك</button><button data-c="1" class="${isC(tool)?'on':''}">${svg(sub)}إضافة ▴</button><button data-t="del" class="${tool=='del'?'on':''}">${svg('del')}حذف</button><button data-a="undo">${svg('undo')}تراجع</button>`;

  h+=`<button data-a="calc" class="calc">${svg('calc')}حساب</button><button data-a="clr" class="cl">${svg('clr')}مسح</button>`;
  tb.innerHTML=h;
  sm.style.display=menu?'grid':'none';
  sm.className=menu=='sup'?'sup':'';sm.innerHTML=(menu=='sup'?SUP:SUB).map(([t,l])=>`<button data-s="${t}" class="${tool==t?'on':''}">${svg(t)}${l}</button>`).join('');
  upd();
}
const tb=$('tb'),sm=$('sm');
tb.onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.a=='calc')return calc();
  if(b.dataset.a=='undo')return undo();
  if(b.dataset.a=='clr'){nodes=[];bars=[];sup={};loads={};pend=null;sel=null;man=null;dirty();return;}
  if(b.dataset.c){menu=menu?false:'main';tool=isC(tool)?tool:sub;}
  else{tool=b.dataset.t;menu=false;}
  pend=null;sel=null;buildTb();render();};
sm.onclick=e=>{const b=e.target.closest('button');if(!b)return;const t=b.dataset.s;if(t=='sup'){menu='sup';buildTb();return;}tool=sub=t;menu=false;pend=null;sel=null;buildTb();render();};
function upd(){
  const ns=tool=='select'&&sel!=null;
  $('pn').style.display=(tool=='node'||ns)?'flex':'none';
  $('pl').style.display=tool=='load'?'flex':'none';
  $('pa').style.display=tool=='bar'?'flex':'none';
  $('ln').innerHTML='<option value="">—</option>'+nodes.map((_,i)=>`<option value="${i}">${nm(i)}</option>`).join('');$('ln').value=sel==null?'':sel;
  const u=document.querySelector('[data-a=undo]');if(u)u.disabled=!hist.length;
  $('go').textContent=tool=='node'?'إضافة':'تحديث';
  if(ns){$('nx').value=nodes[sel].x;$('ny').value=nodes[sel].y;}
  $('hint').textContent=ns?`العقدة ${nm(sel)}: عدّل الفاصلة والترتيبة ثم «تحديث».`:tool=='load'?(sel!=null?`العقدة ${nm(sel)}: اكتب Fx وFy ثم «تطبيق» (يمكن تكرار ذلك لإضافة أحمال أخرى على العقدة نفسها).`:'حدّد العقدة أولًا (بالنقر عليها أو من القائمة) ثم اكتب Fx وFy.'):HINT[tool]||'';
}
$('go').onclick=()=>{
  const x=parseFloat($('nx').value),y=parseFloat($('ny').value);
  if(!isFinite(x)||!isFinite(y))return;
  if(tool=='node'){if(!nodes.some(n=>n.x==x&&n.y==y)){nodes.push({x,y});man=null;dirty();}}
  else if(sel!=null&&!nodes.some((n,i)=>i!=sel&&n.x==x&&n.y==y)){nodes[sel].x=x;nodes[sel].y=y;man=null;dirty();}
};
let hist=[],cur='';
const snapS=()=>JSON.stringify({nodes,bars,sup,loads});
function dirty(){const s=snapS();if(s!==cur){hist.push(cur);if(hist.length>60)hist.shift();cur=s;saveS();}res=null;$('out').innerHTML='';render();upd();}
function undo(){if(!hist.length)return;const s=JSON.parse(hist.pop());nodes=s.nodes;bars=s.bars;sup=s.sup;loads=s.loads;cur=JSON.stringify(s);saveS();pend=null;sel=null;res=null;$('out').innerHTML='';render();upd();}
$('ap').onclick=()=>{if(sel==null){$('hint').textContent='حدّد العقدة أولًا.';return;}const a=parseFloat($('fx').value)||0,b=parseFloat($('fy').value)||0;if(!a&&!b){$('hint').textContent='اكتب قيمة غير صفرية لـ Fx أو Fy.';return;}(loads[sel]=loads[sel]||[]).push([a,b]);dirty();};
$('ln').onchange=()=>{sel=$('ln').value===''?null:+$('ln').value;render();upd();};
const cv=$('cv');
function pt(e){const r=cv.getBoundingClientRect();MPP=V.w/r.width;return{x:V.x0+(e.clientX-r.left)/r.width*V.w,y:V.y0+V.h-(e.clientY-r.top)/r.height*V.h};}
let MPP=.03,man=null;
const snap=v=>{const q=(V.g||1)/2;return +(Math.round(v/q)*q).toFixed(3);};
function nodeAt(p){let b=-1,d=Math.max(.15,24*MPP);nodes.forEach((n,i)=>{const q=Math.hypot(n.x-p.x,n.y-p.y);if(q<d){d=q;b=i;}});return b;}
function barAt(p){let b=-1,d=Math.max(.12,16*MPP);bars.forEach(([i,j],k)=>{const a=nodes[i],c=nodes[j],dx=c.x-a.x,dy=c.y-a.y,t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy))),q=Math.hypot(a.x+t*dx-p.x,a.y+t*dy-p.y);if(q<d){d=q;b=k;}});return b;}
function removeNode(k){nodes.splice(k,1);bars=bars.filter(b=>b[0]!=k&&b[1]!=k).map(b=>b.map(i=>i>k?i-1:i));
  const re=o=>{const r={};for(const i in o){const n=+i;if(n==k)continue;r[n>k?n-1:n]=o[i];}return r;};sup=re(sup);loads=re(loads);sel=null;pend=null;}
function tapAt(e){
  const p=pt(e),k=nodeAt(p);ensureMan();
  if(tool=='select'){sel=k>=0?k:null;upd();render();return;}
  if(tool=='node'){const x=snap(p.x),y=snap(p.y);if(!nodes.some(n=>n.x==x&&n.y==y)){nodes.push({x,y});dirty();}return;}
  if(tool=='bar'){if(k<0){pend=null;render();return;}
    if(pend===null){pend=k;render();return;}
    if(pend!=k&&!bars.some(b=>(b[0]==pend&&b[1]==k)||(b[0]==k&&b[1]==pend)))bars.push([pend,k]);
    pend=null;dirty();return;}
  if(tool=='del'){
    if(k>=0){if(sup[k])delete sup[k];else if(loads[k]){loads[k].pop();if(!loads[k].length)delete loads[k];}else removeNode(k);dirty();return;}
    const b=barAt(p);if(b>=0){bars.splice(b,1);dirty();}return;}
  if(k<0)return;
  if(tool=='load'){sel=k;upd();render();return;}sup[k]=tool;
  dirty();
}
function dragTo(e){const p=pt(e),x=snap(p.x),y=snap(p.y);
  if((nodes[drag].x!=x||nodes[drag].y!=y)&&!nodes.some((n,i)=>i!=drag&&n.x==x&&n.y==y)){nodes[drag].x=x;nodes[drag].y=y;moved=true;render();upd();}}
const SK='truss-v1',ptrs=new Map();let G=null,tapOk=false,sx=0,sy=0,pan0=null;
function saveS(){try{localStorage.setItem(SK,JSON.stringify({nodes,bars,sup,loads,A:$('A').value,sg:$('sg').value,v:2}));}catch(e){}}
function loadS(){try{const s=JSON.parse(localStorage.getItem(SK)||'null');if(s&&Array.isArray(s.nodes)&&s.nodes.every(n=>isFinite(n.x)&&isFinite(n.y))){nodes=s.nodes;bars=(s.bars||[]).filter(b=>nodes[b[0]]&&nodes[b[1]]);sup=s.sup||{};loads=s.loads||{};for(const i in loads)if(typeof loads[i][0]=='number')loads[i]=[loads[i]];if(s.A&&s.v==2)$('A').value=s.A;if(s.sg)$('sg').value=s.sg;}}catch(e){}}
function ensureMan(){if(!man)man={x0:V.x0,y0:V.y0,w:V.w,h:V.h};}
function zoom(f,cx,cy){ensureMan();const nw=Math.min(400,Math.max(1,man.w/f)),r=nw/man.w;man={x0:cx-(cx-man.x0)*r,y0:cy-(cy-man.y0)*r,w:nw,h:man.h*r};render();}
function gst(){ensureMan();const a=[...ptrs.values()];return{d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,cx:(a[0].x+a[1].x)/2,cy:(a[0].y+a[1].y)/2,m:{...man}};}
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size==1){tapOk=true;moved=false;sx=e.clientX;sy=e.clientY;pan0=null;
    const k=nodeAt(pt(e));
    if(tool=='select'&&k>=0){ensureMan();drag=k;sel=k;upd();render();}}
  else{tapOk=false;drag=null;pan0=null;G=gst();}
});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size>=2&&G){const a=[...ptrs.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,cx=(a[0].x+a[1].x)/2,cy=(a[0].y+a[1].y)/2,r=cv.getBoundingClientRect();
    const nw=Math.min(400,Math.max(1,G.m.w*G.d/d)),k=nw/G.m.w,nh=G.m.h*k;
    const mx=G.m.x0+(G.cx-r.left)/r.width*G.m.w,my=G.m.y0+G.m.h-(G.cy-r.top)/r.height*G.m.h;
    man={w:nw,h:nh,x0:mx-(cx-r.left)/r.width*nw,y0:my-nh+(cy-r.top)/r.height*nh};render();return;}
  if(drag!==null){dragTo(e);return;}
  if(tapOk&&Math.hypot(e.clientX-sx,e.clientY-sy)>10){tapOk=false;moved=true;ensureMan();pan0={x:e.clientX,y:e.clientY,m:{...man}};}
  if(pan0&&ptrs.size==1){const r=cv.getBoundingClientRect();man={...pan0.m,x0:pan0.m.x0-(e.clientX-pan0.x)/r.width*pan0.m.w,y0:pan0.m.y0+(e.clientY-pan0.y)/r.height*pan0.m.h};render();}
});
function up(e){
  if(!ptrs.has(e.pointerId))return;
  const was=ptrs.size;ptrs.delete(e.pointerId);
  if(was>=2){G=ptrs.size>=2?gst():null;if(ptrs.size==1){const a=[...ptrs.values()][0];sx=a.x;sy=a.y;tapOk=false;pan0=null;}return;}

function gauss(A,n){
  for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;
    if(Math.abs(A[p][c])<1e-6)throw new Error('المنشأ غير مستقر: أضف مساند أو قضبانًا، وتأكد أن كل عقدة متصلة بقضيب.');
    [A[c],A[p]]=[A[p],A[c]];
    for(let r=c+1;r<n;r++){const f=A[r][c]/A[c][c];for(let j=c;j<=n;j++)A[r][j]-=f*A[c][j];}}
  const x=Array(n).fill(0);for(let i=n-1;i>=0;i--){let s=A[i][n];for(let j=i+1;j<n;j++)s-=A[i][j]*x[j];x[i]=s/A[i][i];}return x;}
function calc(){
  const out=$('out');
  try{
    if(nodes.length<2||!bars.length)throw new Error('ارسم عقدتين وقضيبًا على الأقل.');
    if(!Object.keys(sup).length)throw new Error('أضف مساند للجمالون.');
    const aIn=parseFloat($('A').value),sIn=parseFloat($('sg').value),E=200e6,A=(aIn>0?aIn:10)*1e-4;
    
    const D=nodes.length*2,K=Array.from({length:D},()=>Array(D).fill(0)),F=Array(D).fill(0);
    bars.forEach(([i,j])=>{const dx=nodes[j].x-nodes[i].x,dy=nodes[j].y-nodes[i].y,L=Math.hypot(dx,dy),c=dx/L,s=dy/L,k=E*A/L,v=[c,s,-c,-s],d=[2*i,2*i+1,2*j,2*j+1];
      for(let a=0;a<4;a++)for(let b=0;b<4;b++)K[d[a]][d[b]]+=k*v[a]*v[b];});
    for(const i in loads)loads[i].forEach(([a,b])=>{F[2*i]+=a;F[2*i+1]+=b;});
    const fx=Array(D).fill(false);
    for(const i in sup){if(sup[i]!='rollerY')fx[2*i]=true;if(sup[i]!='rollerX')fx[2*i+1]=true;}
    const fr=[...Array(D).keys()].filter(i=>!fx[i]);
    if(!fr.length)throw new Error('كل درجات الحرية مقيّدة.');
    const sc=1/(E*A);
    const uf=gauss(fr.map(i=>[...fr.map(j=>K[i][j]*sc),F[i]*sc]),fr.length),u=Array(D).fill(0);
    fr.forEach((g,i)=>u[g]=uf[i]);
    const R={};
    for(const i in sup){const r=[0,0];[0,1].forEach(q=>{const g=2*i+q;if(fx[g]){let s=0;for(let j=0;j<D;j++)s+=K[g][j]*u[j];r[q]=s-F[g];}});R[i]=r;}
    const f=bars.map(([i,j])=>{const dx=nodes[j].x-nodes[i].x,dy=nodes[j].y-nodes[i].y,L=Math.hypot(dx,dy);
      return E*A/L*((u[2*j]-u[2*i])*dx/L+(u[2*j+1]-u[2*i+1])*dy/L);});
    res={f};render();
    let h='<div class="card"><h2>القوى الداخلية في القضبان</h2><div class="scroll"><table><tr><th>القضيب</th><th>الطول (m)</th><th>القوة (kN)</th><th>النوع</th></tr>';
    f.forEach((v,k)=>{const [i,j]=bars[k],L=Math.hypot(nodes[j].x-nodes[i].x,nodes[j].y-nodes[i].y),z=Math.abs(v)<1e-6,c=z?'':v>0?'t':'c';
      h+=`<tr><td>${nm(i)}${nm(j)}</td><td>${fmt(L)}</td><td class="${c}">${fmt(Math.abs(v))}</td><td class="${c}">${z?'صفر':v>0?'شدّ':'انضغاط'}</td></tr>`;});
    h+='</table></div></div><div class="card"><h2>ردود أفعال المساند (kN)</h2><div class="scroll"><table><tr><th>العقدة</th><th>Rx</th><th>Ry</th></tr>';
    for(const i in R)h+=`<tr><td>${nm(+i)}</td><td>${fmt(R[i][0])}</td><td>${fmt(R[i][1])}</td></tr>`;
    let mi=0;f.forEach((v,k)=>{if(Math.abs(v)>Math.abs(f[mi]))mi=k;});
    const Nm=Math.abs(f[mi]),bn=nm(bars[mi][0])+nm(bars[mi][1]),ty=Nm<1e-6?'':f[mi]>0?'شدّ':'انضغاط';
    const note=`<br><small>أكبر قوة: ${fmt(Nm)} kN في القضيب ${bn}${ty?' ('+ty+')':''}</small>`;
    let ex='';
    if(aIn>0)ex=`<div class="card"><h2>الإجهاد</h2>σ = <b>${fmt(10*Nm/aIn)}</b> MPa${note}</div>`;
    else if(sIn>0)ex=`<div class="card"><h2>المساحة المطلوبة</h2>A = <b>${fmt(10*Nm/sIn)}</b> cm²${note}</div>`;
    out.innerHTML=ex+h+'</table></div></div>';
  }catch(e){res=null;render();out.innerHTML=`<div class="card err">${e.message}</div>`;}
}
