<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0756a5">
<link rel="icon" type="image/svg+xml" href="icons/app-icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="الأنظمة المثلثية">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>الأنظمة المثلثية</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main>
<div class="cw"><svg id="cv" viewBox="0 0 1200 800"></svg><div id="zm"><button data-z="in">+</button><button data-z="out">−</button><button data-z="fit">⤢</button></div></div>
<div id="sm"></div>
<div id="tb"></div>
<div id="hint"></div>
<div class="row" id="pn"><label>الفاصلة x (m)<input id="nx" type="number" step="any" enterkeyhint="next" value="0"></label><label>الترتيبة y (m)<input id="ny" type="number" step="any" enterkeyhint="done" value="0"></label><button id="go">إضافة</button></div>
<div class="row" id="pl"><label>العقدة<select id="ln"></select></label><label>Fx (kN)<input id="fx" type="number" step="any" enterkeyhint="next" value="0"></label><label>Fy (kN)<input id="fy" type="number" step="any" enterkeyhint="done" value="-10"></label><button id="ap">تطبيق</button></div>
<div class="row" id="pa">
<label>المساحة A (cm²)<input id="A" type="number" step="any" inputmode="decimal" enterkeyhint="next" placeholder="اختياري للمقارنة"></label>
<label>الإجهاد المسموح (MPa)<input id="sall" type="number" step="any" inputmode="decimal" enterkeyhint="done" placeholder="أدخل القيمة"></label>
<small style="flex-basis:100%;color:var(--mut)">أدخل الإجهاد المسموح فقط لحساب مساحة المقطع المطلوبة للقضيب الأحادي والمزدوج، أو أدخل المساحة معه للمقارنة.</small>
</div>
<div id="out"></div>
<div id="projectPanel" class="modal" hidden>
  <section class="modal-box" role="dialog" aria-modal="true" aria-labelledby="projectTitle">
    <div class="modal-head"><h2 id="projectTitle">مشاريعي المحفوظة</h2><button id="closeProjects" type="button">إغلاق</button></div>
    <div class="save-row"><input id="projectName" type="text" maxlength="60" placeholder="اسم المشروع"><button id="saveProject" type="button">حفظ المشروع الحالي</button></div>
    <div id="projectList"></div>
    <p class="modal-note">تُحفظ المشاريع على هذا الجهاز وفي بيانات التطبيق.</p>
  </section>
</div>
<div id="printReport" aria-hidden="true"></div>
</main>
<script defer src="js/01-core.js"></script>
<script defer src="js/02-ui.js"></script>
<script defer src="js/03-state.js"></script>
<script defer src="js/04-interaction.js"></script>
<script defer src="js/05-renderer.js"></script>
<script defer src="js/06-solver.js"></script>
<script defer src="js/07-app.js"></script>
<script defer src="js/08-projects.js"></script>
</body>
</html>
